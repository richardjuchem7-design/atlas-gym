<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ATLAS"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href=".<link rel="apple-touch-icon" href="./icon-512.png?v=4"> ><title>ATLAS — Treino & Nutrição</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;background:#08090b;color:#f5f5f5}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}input,select{background:#181a1f;color:#fff;border:1px solid #34363d;border-radius:12px;padding:12px;width:100%;min-width:0}input:focus,select:focus{outline:1px solid #a3ff6c}input[type=date]{color-scheme:dark}.shell{max-width:680px;margin:auto;padding:env(safe-area-inset-top) 18px calc(104px + env(safe-area-inset-bottom))}header{padding:25px 0 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;font-size:25px;letter-spacing:3px}.brand span{color:#b6ff7b}.muted{color:#90939c;font-size:13px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#a2a6ae;font-weight:800}h1{font-size:29px;letter-spacing:-1px;margin:8px 0 18px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}.card{background:#14161a;border:1px solid #25282e;border-radius:20px;padding:18px;margin:12px 0}.hero{background:linear-gradient(140deg,#222b22,#15171a 70%);border-color:#344136}.metric{font-size:29px;font-weight:850;letter-spacing:-1px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.mini{padding:14px;margin:0}.mini .metric{font-size:23px}.accent{color:#b6ff7b}.btn{border:0;background:#b6ff7b;color:#101410;padding:13px 16px;border-radius:13px;font-weight:800;min-height:44px}.btn.secondary{background:#292c31;color:#fff}.btn.danger{background:#432125;color:#ffb9b9}.btn.small{padding:8px 11px;font-size:12px;min-height:34px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions>*{flex:1}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(17,19,22,.96);border-top:1px solid #303238;display:flex;justify-content:center;padding:9px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(15px)}.tabs button{background:none;border:0;color:#92969d;font-size:10px;font-weight:700;min-width:0;flex:1;max-width:125px;display:flex;flex-direction:column;gap:5px;align-items:center}.tabs button.active{color:#b6ff7b}.tabs svg{width:21px;height:21px}.line{display:flex;justify-content:space-between;align-items:center;gap:10px}.line>div:first-child{min-width:0}.tag{display:inline-block;border-radius:7px;padding:4px 7px;background:#2b342a;color:#b6ff7b;font-size:11px;font-weight:800}.exercise{border-top:1px solid #2b2d32;padding:15px 0}.exercise:first-of-type{border-top:0}.sets{display:grid;grid-template-columns:36px 1fr 1fr 44px;gap:7px;align-items:center;margin-top:8px}.sets input{padding:10px 7px;text-align:center}.sets button{border:1px solid #444;background:#22252a;color:#ddd;border-radius:10px;height:42px}.sets button.done{background:#b6ff7b;color:#111;border-color:#b6ff7b}.field{margin:11px 0}.field label{display:block;color:#a7abb1;font-size:12px;margin-bottom:6px}.progress{height:8px;background:#303238;border-radius:8px;overflow:hidden;margin:7px 0 12px}.progress i{display:block;height:100%;background:#b6ff7b;border-radius:8px}.listrow{padding:13px 0;border-bottom:1px solid #2b2d32}.listrow:last-child{border:0}.empty{color:#8d929a;padding:20px 0;text-align:center}.notice{font-size:12px;color:#a4a7ad;line-height:1.6}.chart{display:flex;align-items:end;gap:9px;height:130px;padding:10px 0 0}.bar{flex:1;background:#b6ff7b;border-radius:5px 5px 0 0;min-height:3px;position:relative}.bar label{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-size:10px;color:#aaa;white-space:nowrap}.scroll{overflow-x:auto}.pill{background:#272a2e;border:0;color:#fff;border-radius:100px;padding:8px 12px;white-space:nowrap}.pill.active{background:#b6ff7b;color:#111}.rowgap{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px}.hide{display:none!important}small{color:#999}a{color:#b6ff7b}#toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#b6ff7b;color:#111;border-radius:12px;padding:12px 20px;display:none;z-index:30;font-weight:750;white-space:nowrap}.split{display:flex;gap:8px}.split>*{flex:1;min-width:0}
</style></head><body><div class="shell"><header><div class="brand">AT<span>L</span>AS<span>.</span></div><span class="tag">PERSONAL TRACKER</span></header><main id="app"></main></div><nav class="tabs" id="tabs"></nav><div id="toast" role="status"></div><input type="file" id="importFile" accept="application/json,.json" hidden><script>
'use strict';const KEY='atlas-gym-v1';const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=v=>Number.isFinite(Number(v))?Number(v):0;const fmt=v=>n(v).toLocaleString('pt-BR',{maximumFractionDigits:1});const workouts=[{name:'CHEST / BACK',ex:[['Barra fixa com peso',2,'8',20],['Supino inclinado máquina',3,'6-8',52.5],['Remada unilateral',2,'8'],['Remada aberta',1,'6'],['Voador reto',2,'8'],['Voador declinado',2,'8'],['Trapézio máquina',2,'8'],['Dips',1,'Falha']]},{name:'HYROX 1',ex:[]},{name:'ARMS',ex:[['Tríceps francês polia',3,'8'],['Bíceps com suporte',3,'8'],['Desenvolvimento halteres',2,'6-8'],['Tríceps extension banco polia',3,'6-10'],['Bíceps Scott unilateral',3,'6-8'],['Elevação lateral máquina',3,'10']]},{name:'HYROX 2',ex:[]},{name:'UPPER',ex:[['Remada aberta Smith apoiado',3,'8'],['Supino reto Smith',2,'6-8'],['Pullover polia banco',2,'8'],['Crossover inclinado',3,'8'],['Tríceps extension banco',3,'8'],['Rosca bayesiana polia',3,'8'],['Remada lombar polia baixa',3,'8'],['Rosca Scott',3,'7'],['Tríceps supino Clark Kent',3,'8']]},{name:'SHOULDERS / LEGS',ex:[['Elevação lateral polia caneleira',2,'10'],['Elevação lateral sentado halter',3,'8'],['Desenvolvimento máquina Hammer',3,'6-8'],['Voador invertido',3,'8-10'],['Extensora unilateral',3,'8'],['Mesa flexora',3,'8-10']]},{name:'DESCANSO',ex:[]}];const defaults=()=>({version:1,created:today(),startDate:today(),workouts:structuredClone(workouts),sessions:[],foods:[],entries:[],targets:{kcal:2400,p:160,c:260,f:75},timerSeconds:90,hyroxNotes:['','']});let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.workouts))state=defaults();else {if(!Array.isArray(state.workouts)||state.workouts.length!==7)state.workouts=structuredClone(workouts);state.workouts=state.workouts.map((w,i)=>({name:typeof w.name==='string'?w.name:workouts[i].name,ex:Array.isArray(w.ex)?w.ex:[]}));}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Armazenamento indisponível. Exporte um backup e verifique o espaço do navegador.')}};let tab='home',selectedWorkout=0,selectedDate=today(),activeSession=null,timerLeft=0,timerId=null;const icon=(path)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${path}"/></svg>`;const nav=[['home','Início','M3 10 12 3l9 7v10H3z M9 20v-7h6v7'],['train','Treinos','M6 4v16 M18 4v16 M3 8v8 M21 8v8 M6 12h12'],['food','Nutrição','M12 22c5-4 9-8 9-13a5 5 0 0 0-9-3 5 5 0 0 0-9 3c0 5 4 9 9 13z'],['history','Histórico','M3 12a9 9 0 1 0 3-6 M3 4v5h5 M12 7v5l4 2'],['settings','Ajustes','M12 3v3 M12 18v3 M3 12h3 M18 12h3 M5.6 5.6l2.1 2.1 M16.3 16.3l2.1 2.1 M18.4 5.6l-2.1 2.1 M7.7 16.3l-2.1 2.1 M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8']];function render(){document.getElementById('tabs').innerHTML=nav.map(([id,label,path])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${icon(path)}${label}</button>`).join('');document.getElementById('app').innerHTML=({home:home,train:train,food:food,history:history,settings:settings}[tab])()};function go(t){tab=t;render();window.scrollTo(0,0)}function toast(msg){let x=document.getElementById('toast');x.textContent=msg;x.style.display='block';clearTimeout(x._t);x._t=setTimeout(()=>x.style.display='none',2200)}function dayIndex(date=today()){return (new Date(date+'T12:00:00').getDay()+6)%7}function nutrition(date=selectedDate){return state.entries.filter(e=>e.date===date).reduce((a,e)=>{for(let k of ['kcal','p','c','f'])a[k]+=n(e[k]);return a},{kcal:0,p:0,c:0,f:0})}function recentSets(exName){return state.sessions.flatMap(s=>s.sets||[]).filter(s=>s.exercise===exName&&s.done).sort((a,b)=>b.date.localeCompare(a.date))}function home(){let day=dayIndex(),w=state.workouts[day],tot=nutrition(today()),completed=state.sessions.filter(s=>s.finished&&s.date===today()).length;return `<div class="eyebrow">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div><h1>Seu progresso começa aqui.</h1><section class="card hero"><div class="eyebrow">TREINO DO DIA · DIA ${day+1}</div><h1 style="margin:12px 0">${esc(w.name)}</h1><p class="muted">${w.ex.length?w.ex.length+' exercícios programados':'Sessão de condicionamento HYROX'}</p><div class="actions"><button class="btn" onclick="selectedWorkout=${day};go('train')">Abrir treino →</button></div></section><div class="grid2"><div class="card mini"><div class="eyebrow">TREINOS HOJE</div><div class="metric">${completed}</div><span class="muted">concluídos</span></div><div class="card mini"><div class="eyebrow">SESSÕES TOTAIS</div><div class="metric">${state.sessions.filter(s=>s.finished).length}</div><span class="muted">registradas</span></div></div><section class="card"><div class="line"><h2>Nutrição de hoje</h2><button class="btn small secondary" onclick="selectedDate=today();go('food')">Registrar +</button></div><div class="line"><div class="metric">${fmt(tot.kcal)} <span class="muted">/ ${fmt(state.targets.kcal)} kcal</span></div></div>${progress(tot.kcal,state.targets.kcal)}<div class="grid3">${[['Proteína','p'],['Carboidratos','c'],['Gorduras','f']].map(([label,k])=>`<div><div class="muted">${label}</div><strong>${fmt(tot[k])} g</strong>${progress(tot[k],state.targets[k])}</div>`).join('')}</div></section><section class="card"><h2>Seu ciclo de 7 dias</h2>${state.workouts.map((w,i)=>`<div class="listrow line"><div><span class="muted">D${i+1} · </span><strong>${esc(w.name)}</strong></div>${i===day?'<span class="tag">HOJE</span>':''}</div>`).join('')}</section>`}function progress(v,max){return `<div class="progress"><i style="width:${Math.min(100,Math.max(0,n(v)/Math.max(1,n(max))*100))}%"></i></div>`}function train(){let w=state.workouts[selectedWorkout];return `<div class="eyebrow">PROGRAMA ARNOLD × UPPER/LOWER</div><h1>Treinamento</h1><div class="rowgap">${state.workouts.map((x,i)=>`<button class="pill ${selectedWorkout===i?'active':''}" onclick="selectedWorkout=${i};activeSession=null;render()">D${i+1} · ${esc(x.name)}</button>`).join('')}</div><section class="card"><div class="eyebrow">DIA ${selectedWorkout+1}</div><h2 style="margin-top:8px">${esc(w.name)}</h2>${w.ex.length?`<p class="muted">${w.ex.length} exercícios · Registre a carga e as repetições realizadas.</p>`:`<p class="muted">${w.name==='DESCANSO'?'Dia de recuperação. Não há treino programado.':'HYROX: registre duração, distância, intensidade e observações.'}</p>`}<div class="field"><label>Data da sessão</label><input type="date" id="sessionDate" value="${today()}"></div>${w.ex.length?`<div id="exerciseList">${w.ex.map((e,idx)=>exerciseHtml(e,idx)).join('')}</div>`:`<div class="grid2"><div class="field"><label>Duração (min)</label><input id="hyDuration" type="number" min="0" step="1" placeholder="45"></div><div class="field"><label>Distância (km)</label><input id="hyDistance" type="number" min="0" step="0.01" placeholder="5"></div></div><div class="field"><label>Esforço percebido (RPE 1–10)</label><input id="hyRpe" type="number" min="1" max="10" placeholder="7"></div><div class="field"><label>Descrição / estações / observações</label><input id="hyNotes" placeholder="Corrida, sled push, burpees..."></div>`}<div class="actions"><button class="btn" onclick="finishWorkout()">Salvar sessão concluída</button></div></section><section class="card"><div class="line"><div><div class="eyebrow">DESCANSO</div><div class="metric" id="timerDisplay">${clock(timerLeft)}</div></div><div style="width:90px"><label class="muted">Segundos</label><input id="restSeconds" type="number" min="5" value="${state.timerSeconds}" onchange="state.timerSeconds=Math.max(5,n(this.value));save()"></div></div><div class="actions"><button class="btn" onclick="startTimer()">Iniciar</button><button class="btn secondary" onclick="pauseTimer()">Pausar</button><button class="btn secondary" onclick="resetTimer()">Zerar</button></div></section>`}function exerciseHtml(e,idx){let [name,count,reps,weight]=e,prior=recentSets(name)[0];let load=prior?prior.weight:weight??'';return `<div class="exercise"><div class="line"><div><h3>${esc(name)}</h3><div class="muted">${count} séries · alvo ${esc(reps)} reps ${prior?'· última carga '+fmt(prior.weight)+' kg':''}</div></div><span class="tag">${idx+1}</span></div><div class="sets"><span class="muted">Série</span><span class="muted">kg</span><span class="muted">reps</span><span class="muted">OK</span></div>${Array.from({length:count},(_,i)=>`<div class="sets" data-ex="${idx}" data-set="${i}"><strong>${i+1}</strong><input class="weight" type="number" inputmode="decimal" min="0" step="0.5" placeholder="kg" value="${esc(load)}"><input class="reps" type="number" inputmode="numeric" min="0" placeholder="${esc(reps)}"><button class="check" onclick="this.classList.toggle('done');this.textContent=this.classList.contains('done')?'✓':'○'">○</button></div>`).join('')}</div>`}function finishWorkout(){let w=state.workouts[selectedWorkout];if(w.name==='DESCANSO')return toast('Domingo é dia de descanso');let date=document.getElementById('sessionDate').value;if(!date)return toast('Selecione a data');let session={id:uid(),date,workout:w.name,day:selectedWorkout,finished:true,created:Date.now(),sets:[]};if(w.ex.length){document.querySelectorAll('[data-ex][data-set]').forEach(row=>{let e=w.ex[Number(row.dataset.ex)],weight=row.querySelector('.weight').value,reps=row.querySelector('.reps').value,done=row.querySelector('.check').classList.contains('done');if(done&&weight!==''&&reps!=='')session.sets.push({exercise:e[0],set:Number(row.dataset.set)+1,weight:n(weight),reps:n(reps),done:true,date})});if(!session.sets.length)return toast('Marque uma série com carga e repetições')}else{session.duration=n(document.getElementById('hyDuration').value);session.distance=n(document.getElementById('hyDistance').value);session.rpe=n(document.getElementById('hyRpe').value);session.notes=document.getElementById('hyNotes').value;if(!session.duration&&!session.distance&&!session.notes.trim())return toast('Informe dados da sessão HYROX')}state.sessions.push(session);save();toast('Sessão salva!');go('history')}function clock(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function updateClock(){let x=document.getElementById('timerDisplay');if(x)x.textContent=clock(timerLeft)}function startTimer(){if(timerId)return;if(!timerLeft)timerLeft=Math.max(5,n(state.timerSeconds));updateClock();timerId=setInterval(()=>{timerLeft=Math.max(0,timerLeft-1);updateClock();if(!timerLeft){pauseTimer();toast('Descanso concluído');if(navigator.vibrate)navigator.vibrate([200,100,200])}},1000)}function pauseTimer(){clearInterval(timerId);timerId=null}function resetTimer(){pauseTimer();timerLeft=0;updateClock()}function food(){let totals=nutrition(),t=state.targets,entries=state.entries.filter(e=>e.date===selectedDate);return `<div class="eyebrow">DIÁRIO ALIMENTAR</div><h1>Nutrição</h1><div class="field"><label>Dia</label><input type="date" value="${selectedDate}" onchange="selectedDate=this.value;render()"></div><section class="card hero"><div class="eyebrow">CALORIAS CONSUMIDAS</div><div class="metric">${fmt(totals.kcal)} <span class="muted">/ ${fmt(t.kcal)} kcal</span></div>${progress(totals.kcal,t.kcal)}<div class="grid3">${[['Proteínas','p'],['Carboidratos','c'],['Gorduras','f']].map(([label,k])=>`<div><div class="muted">${label}</div><strong>${fmt(totals[k])} g</strong>${progress(totals[k],t[k])}</div>`).join('')}</div></section><section class="card"><h2>Adicionar alimento</h2><div class="field"><label>Alimento salvo</label><select id="foodSelect" onchange="fillFood()"><option value="">Novo alimento / escolher...</option>${state.foods.map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('')}</select></div><div class="field"><label>Nome do alimento</label><input id="foodName" placeholder="Ex.: arroz cozido"></div><div class="grid2"><div class="field"><label>Quantidade consumida (g ou porções)</label><input id="foodQty" type="number" min="0.01" step="any" value="100"></div><div class="field"><label>Valores informados por</label><select id="foodBasis"><option value="100">100 g</option><option value="1">1 porção</option></select></div></div><div class="grid2"><div class="field"><label>Calorias (kcal)</label><input id="foodKcal" type="number" min="0" step="any" placeholder="0"></div><div class="field"><label>Proteína (g)</label><input id="foodP" type="number" min="0" step="any" placeholder="0"></div><div class="field"><label>Carboidratos (g)</label><input id="foodC" type="number" min="0" step="any" placeholder="0"></div><div class="field"><label>Gorduras (g)</label><input id="foodF" type="number" min="0" step="any" placeholder="0"></div></div><div class="field"><label>Refeição</label><select id="foodMeal"><option>Café da manhã</option><option>Almoço</option><option>Lanche</option><option>Jantar</option><option>Ceia</option></select></div><div class="actions"><button class="btn" onclick="addFood()">Adicionar ao diário</button></div><p class="notice">Informe valores do rótulo ou de uma tabela nutricional confiável. Para “1 porção”, a quantidade é o número de porções. Valores ausentes são tratados como zero; confira antes de salvar.</p></section><section class="card"><h2>Consumido neste dia</h2>${entries.length?entries.map(e=>`<div class="listrow line"><div><strong>${esc(e.name)}</strong><div class="muted">${esc(e.meal)} · ${fmt(e.qty)} ${e.basis===1?'porção(ões)':'g'} · P ${fmt(e.p)} · C ${fmt(e.c)} · G ${fmt(e.f)}</div></div><div style="text-align:right"><strong>${fmt(e.kcal)} kcal</strong><br><button class="btn small danger" onclick="removeEntry('${e.id}')">Excluir</button></div></div>`).join(''):'<div class="empty">Nenhum alimento registrado.</div>'}</section>`}function fillFood(){let f=state.foods.find(x=>x.id===document.getElementById('foodSelect').value);if(!f)return;for(let [key,value] of Object.entries({foodName:f.name,foodBasis:f.basis,foodKcal:f.kcal,foodP:f.p,foodC:f.c,foodF:f.f,foodQty:f.basis===100?100:1}))document.getElementById(key).value=value}function addFood(){let get=id=>document.getElementById(id).value,name=get('foodName').trim(),qty=n(get('foodQty')),basis=n(get('foodBasis'));if(!name||qty<=0)return toast('Informe alimento e quantidade');let vals={};for(let k of ['Kcal','P','C','F']){let val=get('food'+k);if(val===''||!Number.isFinite(Number(val))||Number(val)<0)return toast('Preencha os 4 valores nutricionais');vals[k.toLowerCase()]=n(val)}let f={id:uid(),name,basis,...vals},existing=state.foods.find(x=>x.name.toLowerCase()===name.toLowerCase()&&x.basis===basis);if(existing)Object.assign(existing,vals);else state.foods.push(f);let factor=qty/basis;state.entries.push({id:uid(),date:selectedDate,name,qty,basis,meal:get('foodMeal'),kcal:vals.kcal*factor,p:vals.p*factor,c:vals.c*factor,f:vals.f*factor});save();toast('Alimento adicionado');render()}function removeEntry(id){if(!confirm('Excluir este alimento do diário?'))return;state.entries=state.entries.filter(e=>e.id!==id);save();render()}function history(){let sessions=[...state.sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created),exNames=[...new Set(state.sessions.flatMap(s=>(s.sets||[]).map(x=>x.exercise)))].sort(),chosen=window.chartExercise&&exNames.includes(window.chartExercise)?window.chartExercise:exNames[0],points=chosen?state.sessions.flatMap(s=>(s.sets||[]).filter(x=>x.exercise===chosen).map(x=>({...x,date:s.date}))).sort((a,b)=>a.date.localeCompare(b.date)):[],max=Math.max(1,...points.map(x=>x.weight));return `<div class="eyebrow">CONSISTÊNCIA & PERFORMANCE</div><h1>Histórico</h1><div class="grid2"><div class="card mini"><div class="eyebrow">SESSÕES</div><div class="metric">${sessions.length}</div></div><div class="card mini"><div class="eyebrow">SÉRIES REGISTRADAS</div><div class="metric">${sessions.reduce((a,s)=>a+(s.sets||[]).length,0)}</div></div></div><section class="card"><h2>Progressão de carga</h2>${exNames.length?`<div class="field"><label>Exercício</label><select onchange="window.chartExercise=this.value;render()">${exNames.map(x=>`<option ${x===chosen?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="metric">${fmt(max)} kg <span class="muted">maior carga registrada</span></div><div class="chart">${points.slice(-12).map(p=>`<div class="bar" style="height:${Math.max(3,p.weight/max*100)}%" title="${esc(p.date)} · ${fmt(p.weight)} kg × ${fmt(p.reps)}"><label>${p.date.slice(5)}</label></div>`).join('')}</div><div style="height:22px"></div><p class="notice">Cada barra representa uma série, em ordem cronológica. Toque e segure para detalhes quando disponível.</p>`:'<div class="empty">Registre um treino para ver a progressão.</div>'}</section><section class="card"><h2>Sessões concluídas</h2>${sessions.length?sessions.map(s=>`<div class="listrow"><div class="line"><div><strong>${esc(s.workout)}</strong><div class="muted">${new Date(s.date+'T12:00:00').toLocaleDateString('pt-BR')} · ${(s.sets||[]).length} séries ${s.duration?'· '+fmt(s.duration)+' min':''}${s.distance?' · '+fmt(s.distance)+' km':''}</div></div><button class="btn small danger" onclick="deleteSession('${s.id}')">Excluir</button></div>${s.notes?`<p class="notice">${esc(s.notes)}</p>`:''}${s.sets?.length?`<details><summary class="muted">Ver séries</summary>${s.sets.map(x=>`<div class="muted">${esc(x.exercise)} · ${fmt(x.weight)} kg × ${fmt(x.reps)}</div>`).join('')}</details>`:''}</div>`).join(''):'<div class="empty">Nenhuma sessão concluída.</div>'}</section>`}function deleteSession(id){if(!confirm('Excluir esta sessão e suas séries?'))return;state.sessions=state.sessions.filter(s=>s.id!==id);save();render()}function settings(){return `<div class="eyebrow">PREFERÊNCIAS & DADOS</div><h1>Ajustes</h1><section class="card"><h2>Metas nutricionais</h2><div class="grid2">${[['Calorias (kcal)','kcal'],['Proteínas (g)','p'],['Carboidratos (g)','c'],['Gorduras (g)','f']].map(([label,k])=>`<div class="field"><label>${label}</label><input id="target_${k}" type="number" min="0" value="${state.targets[k]}"></div>`).join('')}</div><button class="btn" onclick="saveTargets()">Salvar metas</button><p class="notice">Valores iniciais são apenas exemplos editáveis, não uma prescrição nutricional.</p></section><section class="card"><h2>Agenda semanal editável</h2><p class="notice">Altere nomes, dias, ordem e exercícios na seção abaixo. O treino exibido no início acompanha automaticamente suas mudanças.</p></section>${editorPanel()}<section class="card"><h2>Backup e restauração</h2><p class="notice">Seus dados ficam neste navegador/dispositivo. Exporte backups regularmente; apagar dados do Safari ou trocar de aparelho pode remover registros locais.</p><div class="actions"><button class="btn" onclick="exportBackup()">Exportar JSON</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">Importar JSON</button></div></section><section class="card"><h2>Gerenciamento</h2><button class="btn danger" onclick="resetAll()">Apagar todos os dados</button><p class="notice">Esta ação é irreversível sem um backup.</p></section><p class="notice">ATLAS v1.1 · PWA offline · Não substitui acompanhamento profissional.</p>`}function editorPanel(){return `<section class="card" id="planEditor"><div class="eyebrow">PERSONALIZAÇÃO COMPLETA</div><h2>Editar rotina e exercícios</h2><p class="notice">Selecione um dia para mudar o treino, editar exercícios e reorganizar a sequência. Alterações são salvas automaticamente e não apagam sessões anteriores.</p><div class="field"><label>Dia da semana</label><select id="editDay" onchange="window.editDay=Number(this.value);render()">${['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'].map((d,i)=>`<option value="${i}" ${i===(window.editDay??0)?'selected':''}>${d} — ${esc(state.workouts[i].name)}</option>`).join('')}</select></div>${editDayContent()}</section>`}
function editDayContent(){let day=window.editDay??0,w=state.workouts[day];return `<div class="field"><label>Nome do treino</label><input id="editWorkoutName" value="${esc(w.name)}" placeholder="Nome do treino"></div><button class="btn small" onclick="renameWorkout()">Salvar nome</button><div class="field"><label>Trocar o treino deste dia com outro dia</label><select id="swapDay">${['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'].map((d,i)=>`<option value="${i}" ${i===day?'disabled':''}>${d} — ${esc(state.workouts[i].name)}</option>`).join('')}</select></div><button class="btn small secondary" onclick="swapWorkout()">Trocar dias</button><h3 style="margin-top:22px">Ordem dos exercícios</h3>${w.ex.length?w.ex.map((e,i)=>`<div class="listrow"><div class="line"><div><strong>${i+1}. ${esc(e[0])}</strong><div class="muted">${fmt(e[1])} séries · ${esc(e[2])} reps${e[3]!==undefined?' · '+fmt(e[3])+' kg':''}</div></div><div class="actions" style="margin:0;flex:0 0 auto"><button class="btn small secondary" aria-label="Subir exercício" onclick="moveExercise(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="btn small secondary" aria-label="Descer exercício" onclick="moveExercise(${i},1)" ${i===w.ex.length-1?'disabled':''}>↓</button><button class="btn small secondary" onclick="editExercise(${i})">Editar</button><button class="btn small danger" onclick="removeExercise(${i})">×</button></div></div></div>`).join(''):'<p class="muted">Nenhum exercício cadastrado.</p>'}<button class="btn" style="margin-top:14px" onclick="editExercise(-1)">+ Adicionar exercício</button><div id="exerciseEditor"></div>`}
function renameWorkout(){let day=window.editDay??0,value=document.getElementById('editWorkoutName').value.trim();if(!value)return toast('Informe o nome');state.workouts[day].name=value;save();render();toast('Nome atualizado')}
function swapWorkout(){let a=window.editDay??0,b=Number(document.getElementById('swapDay').value);if(a===b)return toast('Selecione outro dia');[state.workouts[a],state.workouts[b]]=[state.workouts[b],state.workouts[a]];save();render();toast('Dias trocados')}
function moveExercise(i,d){let ex=state.workouts[window.editDay??0].ex,j=i+d;if(j<0||j>=ex.length)return;[ex[i],ex[j]]=[ex[j],ex[i]];save();render()}
function removeExercise(i){if(!confirm('Excluir este exercício da rotina? O histórico será preservado.'))return;state.workouts[window.editDay??0].ex.splice(i,1);save();render()}
function editExercise(i){let ex=state.workouts[window.editDay??0].ex,e=i>=0?ex[i]:['',3,'8',''];document.getElementById('exerciseEditor').innerHTML=`<div class="card" style="border-color:#526348"><h3>${i<0?'Novo exercício':'Editar exercício'}</h3><div class="field"><label>Exercício</label><input id="exName" value="${esc(e[0])}" placeholder="Ex.: Agachamento"></div><div class="grid2"><div class="field"><label>Séries</label><input id="exSets" type="number" min="1" max="30" value="${esc(e[1])}"></div><div class="field"><label>Repetições / objetivo</label><input id="exReps" value="${esc(e[2])}" placeholder="6-8 ou Falha"></div></div><div class="field"><label>Carga inicial (kg, opcional)</label><input id="exWeight" type="number" min="0" step="0.5" value="${e[3]??''}"></div><div class="actions"><button class="btn" onclick="saveExercise(${i})">Salvar exercício</button><button class="btn secondary" onclick="document.getElementById('exerciseEditor').innerHTML=''">Cancelar</button></div></div>`;document.getElementById('exName').focus()}
function saveExercise(i){let name=document.getElementById('exName').value.trim(),sets=Number(document.getElementById('exSets').value),reps=document.getElementById('exReps').value.trim(),weight=document.getElementById('exWeight').value;if(!name||!reps||!Number.isInteger(sets)||sets<1||sets>30)return toast('Confira nome, séries e repetições');if(weight!==''&&(!Number.isFinite(Number(weight))||Number(weight)<0))return toast('Carga inválida');let entry=[name,sets,reps];if(weight!=='')entry.push(Number(weight));let ex=state.workouts[window.editDay??0].ex;if(i<0)ex.push(entry);else ex[i]=entry;save();render();toast('Exercício salvo')}
function saveTargets(){for(let k of ['kcal','p','c','f'])state.targets[k]=Math.max(0,n(document.getElementById('target_'+k).value));save();toast('Metas salvas');render()}function exportBackup(){let blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='atlas-backup-'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}document.getElementById('importFile').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.workouts)||!Array.isArray(data.sessions)||!Array.isArray(data.entries)||!Array.isArray(data.foods)||!data.targets||typeof data.startDate!=='string')throw Error('Estrutura inválida');if(!confirm('Substituir todos os dados atuais pelos dados deste backup?'))return;state=data;save();go('home');toast('Backup restaurado')}catch(err){alert('Não foi possível importar: '+err.message)}finally{e.target.value=''}});function resetAll(){if(!confirm('Apagar todos os treinos, alimentos e configurações?'))return;if(!confirm('Confirma a exclusão definitiva?'))return;state=defaults();save();go('home')}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));
</script></body></html>
